name: Docker Build & Vulnerability Scan

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'docker/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  docker-build-scan:
    name: Build & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build Backend Image Locally for Scanning
      - name: Build Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./app/backend
          file: ./app/backend/Dockerfile
          load: true
          tags: aethergrid-backend:local-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy Vulnerability Scan on Backend
      - name: Scan Backend Container with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'aethergrid-backend:local-scan'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Build Frontend Image Locally for Scanning
      - name: Build Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./app/frontend
          file: ./app/frontend/Dockerfile
          load: true
          tags: aethergrid-frontend:local-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy Vulnerability Scan on Frontend
      - name: Scan Frontend Container with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'aethergrid-frontend:local-scan'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
